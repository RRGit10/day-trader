<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daytrader · Calendar</title>
<style>
  :root {
    --bg: #000; --panel: #111; --bar: #1c1c1c; --line: #000;
    --past: #5f5f5f; --future: #2e2e2e; --outside: #1a1a1a;
    --win: #1e8e4e; --loss: #b8322b; --text: #f2f2f2; --muted: #9a9a9a; --dim: #6a6a6a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 auto 0 0; }
  .seg { display: inline-flex; background: var(--bar); border-radius: 6px; overflow: hidden; }
  .seg button, .nav button { background: none; border: 0; color: var(--muted); font: inherit;
         padding: 7px 14px; cursor: pointer; }
  .seg button.on { background: #333; color: var(--text); }
  .nav { display: inline-flex; align-items: center; background: var(--bar); border-radius: 6px; }
  .nav span { min-width: 90px; text-align: center; font-size: 17px; }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow { background: var(--bar); border-radius: 4px; margin-bottom: 8px; }
  .dow div { text-align: center; padding: 12px 0; color: var(--muted); }
  .grid { gap: 2px; background: var(--line); border-radius: 8px; overflow: hidden; }
  .grid.year { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cell { background: var(--past); min-height: 84px; padding: 12px 4px; text-align: center;
          display: flex; flex-direction: column; justify-content: center; gap: 8px;
          cursor: pointer; border: 2px solid transparent; }
  .cell .n { font-size: 16px; }
  .cell .v { font-size: 15px; font-variant-numeric: tabular-nums; }
  .cell.future { background: var(--future); color: var(--muted); cursor: default; }
  .cell.win { background: var(--win); }
  .cell.loss { background: var(--loss); }
  .cell.outside { opacity: .45; }
  .cell.outside.future { background: var(--outside); }
  .cell.sel { border-color: #fff; }
  .summary { display: flex; flex-wrap: wrap; gap: 22px; margin: 14px 2px; color: var(--muted); }
  .summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pos { color: #3ccf7c !important; } .neg { color: #ff6b61 !important; }
  .detail { background: var(--panel); border-radius: 8px; padding: 12px 14px; }
  .detail h2 { font-size: 16px; font-weight: 500; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid #222; }
  th { color: var(--muted); font-weight: 400; border-top: 0; }
  .foot { margin-top: 10px; color: var(--dim); font-size: 12px; }
  @media (max-width: 760px) {
    .wrap { padding: 10px 8px; }
    header { gap: 8px; }
    h1 { font-size: 19px; flex-basis: 100%; }
    .seg button, .nav button { padding: 6px 10px; }
    .nav span { min-width: 72px; font-size: 15px; }
    .dow div { padding: 8px 0; font-size: 12px; }
    .cell { min-height: 66px; padding: 8px 1px; gap: 4px; }
    .cell .n { font-size: 13px; }
    .cell .v { font-size: 11.5px; }
    .grid.year { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .summary { gap: 6px 16px; font-size: 13px; }
    th, td { padding: 5px 4px; font-size: 12px; }
  }
  @media (max-width: 480px) {
    .grid { gap: 1px; }
    .cell { min-height: 56px; padding: 6px 0; }
    .cell .v { font-size: 9.5px; letter-spacing: -0.2px; }
    .dow div { font-size: 11px; }
  }
  .err { background: #3a1412; color: #ffb3ad; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calendar</h1>
    <div class="seg" id="journal">
      <button data-j="approval">Approval</button><button data-j="bot">Bot</button><button data-j="backtest">Backtest</button>
    </div>
    <div class="nav"><button id="prev" aria-label="previous">&#9664;</button><span id="label"></span><button id="next" aria-label="next">&#9654;</button></div>
    <div class="seg" id="view"><button data-v="month">Month</button><button data-v="year">Year</button></div>
  </header>
  <div id="err" class="err" hidden></div>
  <div class="dow" id="dow"></div>
  <div class="grid" id="grid"></div>
  <div class="summary" id="summary"></div>
  <div class="detail" id="detail" hidden></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const S = { journal: "approval", view: "month", year: null, month: null, selected: null,
            today: null, days: new Map() };
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const money = (v) => (v > 0 ? "+" : "") + v.toFixed(2);
const pctOf = (pnl, cost) => cost ? Math.round(pnl / cost * 10000) / 100 : 0;
const pctText = (v) => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const tone = (v) => v > 0 ? "win" : v < 0 ? "loss" : "";
const signClass = (v) => v > 0 ? "pos" : v < 0 ? "neg" : "";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;  // a slower, older response must not overwrite a newer one
  try {
    const r = await fetch(`/api/days?journal=${S.journal}`, { cache: "no-store" });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    if (seq !== loadSeq) return;
    S.today = data.today;
    S.days = new Map(data.days.map((d) => [d.date, d]));
    if (S.year === null) {
      S.year = +data.today.slice(0, 4);
      S.month = +data.today.slice(5, 7) - 1;
    }
    $("err").hidden = true;
    $("foot").textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 30 s · ` +
      "a trade counts on the day it closed (ET); % = P&L ÷ money put into those trades";
  } catch (e) {
    if (seq !== loadSeq) return;
    $("err").hidden = false;
    $("err").textContent = `Can't load the ${S.journal} journal: ${e.message || e}. Is \`daytrader calendar\` still running?`;
  }
  render();
}

function totals(prefix) {
  let pnl = 0, cost = 0, trades = 0, wins = 0, losses = 0;
  for (const [date, d] of S.days) {
    if (!date.startsWith(prefix)) continue;
    pnl += d.pnl; cost += d.cost; trades += d.trades.length;
    if (d.pnl > 0) wins++; else if (d.pnl < 0) losses++;
  }
  pnl = Math.round(pnl * 100) / 100;
  return { pnl, pct: pctOf(pnl, cost), trades, wins, losses };
}

function fillCell(cell, label, key, isFuture, value) {
  cell.append(el("div", "n", label));
  if (isFuture) { cell.classList.add("future"); cell.append(el("div", "v", "--")); return; }
  const v = value || { pnl: 0, pct: 0 };
  const t = tone(v.pnl);
  if (t) cell.classList.add(t);
  cell.append(el("div", "v", `${money(v.pnl)} ${pctText(v.pct)}`));
}

function renderMonth() {
  const grid = $("grid");
  grid.className = "grid";
  $("dow").hidden = false;
  $("dow").replaceChildren(...DOW.map((d) => el("div", "", d)));
  $("label").textContent = `${S.year}/${pad(S.month + 1)}`;
  const first = new Date(Date.UTC(S.year, S.month, 1));
  const start = Date.UTC(S.year, S.month, 1 - first.getUTCDay());
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start + i * 86400000);
    const key = ymd(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    const cell = el("div", "cell");
    if (d.getUTCMonth() !== S.month) cell.classList.add("outside");
    const isFuture = key > S.today;
    fillCell(cell, key === S.today ? "Today" : String(d.getUTCDate()), key, isFuture, S.days.get(key));
    if (key === S.selected) cell.classList.add("sel");
    if (!isFuture) cell.onclick = () => { S.selected = key; render(); };
    cells.push(cell);
  }
  grid.replaceChildren(...cells);
  summary(totals(`${S.year}-${pad(S.month + 1)}`), `${MONTHS[S.month]} ${S.year}`);
  detail();
}

function renderYear() {
  const grid = $("grid");
  grid.className = "grid year";
  $("dow").hidden = true;
  $("label").textContent = String(S.year);
  const thisMonth = S.today.slice(0, 7);
  const cells = MONTHS.map((name, m) => {
    const key = `${S.year}-${pad(m + 1)}`;
    const cell = el("div", "cell");
    const isFuture = key > thisMonth;
    fillCell(cell, name, key, isFuture, totals(key));
    if (!isFuture) cell.onclick = () => { S.month = m; S.view = "month"; S.selected = null; render(); };
    return cell;
  });
  grid.replaceChildren(...cells);
  summary(totals(String(S.year)), String(S.year));
  $("detail").hidden = true;
}

function summary(t, label) {
  const box = $("summary");
  const item = (name, value, cls) => {
    const span = el("span", "", `${name} `);
    span.append(el("b", cls || "", value));
    return span;
  };
  box.replaceChildren(
    item(label, `${money(t.pnl)} (${pctText(t.pct)})`, signClass(t.pnl)),
    item("Winning days", String(t.wins), "pos"),
    item("Losing days", String(t.losses), "neg"),
    item("Trades", String(t.trades)),
  );
}

function detail() {
  const box = $("detail");
  if (!S.selected || !S.selected.startsWith(`${S.year}-${pad(S.month + 1)}`)) { box.hidden = true; return; }
  box.hidden = false;
  const d = S.days.get(S.selected);
  const head = el("h2", "", S.selected);
  if (!d) { box.replaceChildren(head, el("div", "", "No closed trades this day.")); return; }
  head.append(document.createTextNode(" · "), el("span", signClass(d.pnl), `${money(d.pnl)} (${pctText(d.pct)})`));
  const table = el("table");
  const hr = el("tr");
  for (const h of ["Closed", "Ticker", "Side", "Qty", "Entry → Exit", "P&L", "Exit reason"]) hr.append(el("th", "", h));
  table.append(hr);
  for (const t of d.trades) {
    const tr = el("tr");
    tr.append(el("td", "", t.closed_at), el("td", "", t.ticker),
              el("td", "", t.direction === "long" ? "long (call)" : "short (put)"),
              el("td", "", String(t.qty)),
              el("td", "", `${t.entry_price.toFixed(2)} → ${t.exit_price.toFixed(2)}`),
              el("td", signClass(t.pnl), money(t.pnl)), el("td", "", t.reason.replaceAll("_", " ")));
    table.append(tr);
  }
  box.replaceChildren(head, table);
}

function render() {
  for (const b of $("journal").children) b.classList.toggle("on", b.dataset.j === S.journal);
  for (const b of $("view").children) b.classList.toggle("on", b.dataset.v === S.view);
  if (S.today === null) return;
  S.view === "month" ? renderMonth() : renderYear();
}

function step(dir) {
  if (S.year === null) return;
  if (S.view === "year") S.year += dir;
  else {
    S.month += dir;
    if (S.month < 0) { S.month = 11; S.year--; }
    if (S.month > 11) { S.month = 0; S.year++; }
  }
  render();
}

$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
for (const b of $("journal").children) b.onclick = () => { S.journal = b.dataset.j; S.selected = null; load(); };
for (const b of $("view").children) b.onclick = () => { S.view = b.dataset.v; render(); };
render();
load();
setInterval(load, 30000);
</script>
</body>
</html>
